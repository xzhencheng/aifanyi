[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aifanyi"
version = "0.1.0"
description = "Accuracy-first conversational translation service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "sqlalchemy==2.0.54", "alembic==1.20.0",
  "psycopg[binary,pool]==3.3.6", "langgraph==1.2.12",
  "langgraph-checkpoint-postgres==3.1.2", "langgraph-checkpoint-sqlite==3.1.1",
  "celery==5.6.3", "redis==8.1.0", "httpx==0.28.1", "PyJWT[crypto]==2.14.0",
  "pydantic-settings==2.15.0", "python-dotenv==1.2.3"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[project.scripts]
aifanyi = "aifanyi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

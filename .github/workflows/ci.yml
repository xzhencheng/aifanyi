name: Verify implementation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aifanyi
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: aifanyi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aifanyi -d aifanyi_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AIFANYI_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://aifanyi:ci-only-test-password@localhost:5432/aifanyi_test' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check src tests migrations
      - name: Migrations and integration tests
        run: |
          if [ -n "$AIFANYI_TEST_DATABASE_URL" ]; then
            export AIFANYI_DATABASE_URL="$AIFANYI_TEST_DATABASE_URL"
            export AIFANYI_CHECKPOINT_URL="$AIFANYI_TEST_DATABASE_URL"
          fi
          aifanyi migrate
          aifanyi init
          alembic check
          pytest -q
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/chat/package-lock.json
      - run: npm --prefix apps/chat ci --no-audit --no-fund
      - run: npm --prefix apps/chat run build
